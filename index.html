<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay</title>
<meta name="description" content="Relay: one board for every Claude session.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171E26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Relay">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="side" aria-label="Relay navigation">
    <div class="side-brand"><span data-mark="22" style="display:flex"></span>Relay</div>
    <nav id="nav"></nav>
    <div class="side-notif" id="sidenotif"></div>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <div class="sidescrim" id="sidescrim" hidden></div>
  <section class="pane">
    <div class="phead" id="phead">
    <div class="mbrand"><span data-mark="26" style="display:flex"></span><span>Relay</span></div>
    <div class="bar">
      <button class="iconbtn" id="menubtn" aria-label="Open navigation"></button>
      <div class="bar-title"><h1 id="vtitle">All tickets</h1><span class="n" id="vcount"></span></div>
      <span class="tag" id="sampletag" hidden>Sample data · edits not saved</span>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="View">
        <button id="v-list" aria-pressed="true">List</button>
        <button id="v-board" aria-pressed="false">Board</button>
      </div>
      <button class="btn primary" id="newbtn">+ New</button>
    </div>
    <div class="bar2">
      <label class="search" for="q">
        <svg id="searchicon"></svg>
        <input id="q" type="search" placeholder="Search IDs or titles: LST-7, BLC-52…" autocomplete="off" aria-label="Search tickets">
        <kbd>/</kbd>
      </label>
    </div>
    </div>
    <div class="offbar" id="offbar" hidden></div>
    <div class="waitbar" id="waitbar" hidden></div>
    <div class="scroll" id="out"></div>
  </section>
</div>
<main class="gate" id="gate" hidden></main>
<div id="drawerhost"></div>
<div id="modalhost"></div>
<div id="toasthost"></div>
<noscript><p style="padding:24px">Relay needs JavaScript.</p></noscript>
<script type="module" src="./js/app.js"></script>
</body>
</html>
